[package]
name = "flowglass"
version = "0.2.2"
description = "Flowglass 沙漏番茄钟"
edition = "2021"

[lib]
name = "flowglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
